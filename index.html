<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>휴롬 농장 탐험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: one portrait play stage (max 480px) with DOM cards floating over a canvas; a single pastel clay world, no dark variant by choice. */
:root{
  --peach:#FFE3D3; --lilac:#DCCBFF; --cream:#FFF8F0; --plum:#4A2E5C; --plum-soft:#7B6189;
  --coral:#FF7A6B; --coral-deep:#E85D50; --gold:#FFC94D; --mint:#6FCFA6; --mint-deep:#3FA97D; --shade:rgba(74,46,92,.18);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
*{word-break:keep-all}
body{background:linear-gradient(160deg,var(--peach),var(--lilac));color:var(--plum);font-family:var(--body);font-weight:500;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--peach) center/cover no-repeat;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.dim{background:rgba(74,46,92,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;text-align:center}
h1{font-size:clamp(34px,10vw,46px);line-height:1.1;color:var(--plum);text-shadow:0 3px 0 #fff,0 6px 14px var(--shade)}
h2{font-size:28px;line-height:1.15}
p{margin:0;text-align:center;line-height:1.5}
.brand{font-family:var(--display);letter-spacing:.22em;font-size:14px;color:var(--plum-soft);background:rgba(255,255,255,.75);padding:5px 14px 4px;border-radius:99px}
.sub{color:var(--plum-soft);font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.btn{font-family:var(--display);font-size:22px;color:#fff;background:var(--coral);padding:14px 30px 12px;border-radius:99px;min-width:200px;
  box-shadow:inset 0 -5px 0 var(--coral-deep),inset 0 3px 0 rgba(255,255,255,.4),0 8px 16px var(--shade);transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.alt{background:#fff;color:var(--plum);box-shadow:inset 0 -5px 0 #E9DDF3,0 8px 16px var(--shade)}
.btn.mint{background:var(--mint);box-shadow:inset 0 -5px 0 var(--mint-deep),inset 0 3px 0 rgba(255,255,255,.4),0 8px 16px var(--shade)}
.card{background:var(--cream);border-radius:28px;padding:22px 20px;width:100%;max-width:340px;box-sizing:border-box;
  box-shadow:inset 0 -6px 0 #F1E3D6,inset 0 3px 0 #fff,0 14px 28px var(--shade);display:flex;flex-direction:column;align-items:center;gap:12px}
/* hub */
.games{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.game{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:12px;text-align:left;background:var(--cream);border-radius:26px;padding:12px 16px 14px 12px;
  box-shadow:inset 0 -6px 0 #F1E3D6,inset 0 3px 0 #fff,0 12px 24px var(--shade);transition:transform .08s}
.game:active{transform:translateY(3px) scale(.985)}
.game .pic{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;position:relative}
.game .pic img{width:70px;height:70px}
.game.s .pic{background:#FFD9CF}.game.c .pic{background:#CFE9FF}
.game b{font-family:var(--display);font-weight:400;font-size:23px;display:block;line-height:1.15}
.game span{font-size:13.5px;color:var(--plum-soft);display:block;margin-top:3px;line-height:1.35}
.game i{font-style:normal;font-size:12.5px;color:var(--coral-deep);font-weight:700;display:block;margin-top:5px;font-variant-numeric:tabular-nums}
.chipbtn{background:rgba(255,255,255,.8);border-radius:99px;padding:9px 16px;font-size:14px;font-weight:700;color:var(--plum)}
/* farm map */
#hub{justify-content:flex-start;gap:10px;padding-block:14px}
#hub h1{font-size:clamp(28px,8.4vw,36px)}
#map{position:absolute;inset:0;pointer-events:none}
#map svg{position:absolute;inset:0;width:100%;height:100%}
#map polyline{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:1 15;vector-effect:non-scaling-stroke;filter:drop-shadow(0 2px 2px rgba(74,46,92,.35))}
.node{pointer-events:auto;position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--cream);display:grid;place-items:center;
  box-shadow:inset 0 -5px 0 #F1E3D6,inset 0 3px 0 #fff,0 7px 14px rgba(74,46,92,.3);font-family:var(--display);font-size:24px;color:var(--plum)}
.node b{font-weight:400;line-height:1;padding-top:3px}
.node img{width:50px;height:50px}
.node span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:14px;color:var(--gold);letter-spacing:1px;text-shadow:0 1px 0 #B9820F,0 0 4px #fff;white-space:nowrap;margin-top:-3px}
.node.cur{background:var(--coral);color:#fff;box-shadow:inset 0 -5px 0 var(--coral-deep),inset 0 3px 0 rgba(255,255,255,.4),0 0 0 6px rgba(255,255,255,.75),0 8px 16px rgba(74,46,92,.35);animation:bob 1.2s ease-in-out infinite}
.node.lock{background:#E9E1EE;color:#A996B5;box-shadow:inset 0 -5px 0 #D5C9DD,0 5px 10px rgba(74,46,92,.2)}
.node:active{transform:scale(.94)}
a.btn{text-decoration:none;text-align:center;box-sizing:border-box}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.node.cur{animation:none}}
/* lively touches */
#fx,#fxTop{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fxTop{z-index:60}
.jig{position:absolute;background-repeat:no-repeat;transform-origin:50% 92%;-webkit-mask:radial-gradient(closest-side,#000 70%,transparent);mask:radial-gradient(closest-side,#000 70%,transparent);animation:jig .95s ease-out forwards}
.jig.soft{animation:jigS 2.6s ease-in-out forwards}
@keyframes jig{15%{transform:rotate(-6deg) scale(1.07,.95)}35%{transform:rotate(5deg) scale(.96,1.06)}55%{transform:rotate(-3deg) scale(1.02,.99)}75%{transform:rotate(2deg)}100%{transform:none}}
@keyframes jigS{25%{transform:rotate(-2.2deg)}50%{transform:rotate(1.8deg) scale(1.01)}75%{transform:rotate(-1deg)}100%{transform:none}}
.pt{position:absolute;width:28px;height:28px;margin:-14px;animation:drop .95s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes drop{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1;transform:translate(0,-10px) scale(1)}100%{transform:translate(var(--dx),80px) rotate(220deg);opacity:0}}
.pt.up{animation:popUp .8s ease-out forwards}
@keyframes popUp{0%{transform:translateY(10px) scale(.3);opacity:0}30%{transform:translateY(-34px) scale(1.15);opacity:1}70%{transform:translateY(-26px) scale(1);opacity:1}100%{transform:translateY(-10px) scale(.6);opacity:0}}
.sp{position:absolute;width:14px;height:14px;margin:-7px;background:#FFD867;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .6s ease-out forwards}
.sp.w{background:#fff}
@keyframes spk{from{transform:scale(.2);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(90deg);opacity:0}}
.rg{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;border:3px solid rgba(255,255,255,.9);box-sizing:border-box;animation:rg .5s ease-out forwards}
@keyframes rg{to{transform:scale(3.6);opacity:0}}
button:active,a.btn:active,a.chipbtn:active{transform:scale(.93)}
.boing{animation:boing .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes boing{0%{transform:scale(.9)}45%{transform:scale(1.1)}75%{transform:scale(.97)}100%{transform:none}}
.node{animation:nfl 3.4s ease-in-out infinite}
@keyframes nfl{50%{transform:translateY(-4px)}}
#map polyline{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
#giftBtn img{animation:gift 3.6s ease-in-out infinite}
@keyframes gift{0%,78%,100%{transform:none}82%{transform:rotate(-12deg) scale(1.1)}88%{transform:rotate(10deg) scale(1.1)}94%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.node,#map polyline,#giftBtn img,.jig,.boing{animation:none!important}}
/* welcome: pick a farmer and a name */
.avs{display:flex;gap:12px;justify-content:center}
.avc{width:122px;height:156px;border-radius:24px;background:#FFF1E6;display:grid;place-items:center;padding:0;box-shadow:inset 0 0 0 3px transparent;transition:background .15s}
.avc img{height:136px;width:auto;max-width:none;display:block}
.avc.on{background:#FFE9A8;box-shadow:inset 0 0 0 3px var(--gold)}
.avc.on img{animation:idle 1.8s ease-in-out infinite;transform-origin:50% 100%}
.avs.sm{gap:8px;flex:1;justify-content:flex-start}
.avs.sm .avc{width:62px;height:78px;border-radius:16px}.avs.sm .avc img{height:66px}
#welcome .card{max-height:100%;overflow-y:auto}
#welcome .brand{height:36px}
/* settings, ranking, records */
#settings .card,#rank .card{max-height:100%;overflow-y:auto;gap:10px;padding:18px 16px}
.frow{display:flex;gap:8px;width:100%;align-items:center}
.frow label{font-size:13px;font-weight:700;color:var(--plum-soft);flex:none}
input[type=text]{font:inherit;font-weight:700;color:var(--plum);background:#fff;border:2px solid #EADDF0;border-radius:14px;padding:9px 12px;min-width:0;flex:1;-webkit-user-select:text;user-select:text}
input[type=text]:focus{outline:none;border-color:var(--coral)}
.sbtn{font-family:var(--display);font-size:16px;color:#fff;background:var(--coral);border-radius:99px;padding:10px 16px 8px;box-shadow:inset 0 -4px 0 var(--coral-deep);flex:none}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;background:#FFF1E6;border-radius:16px;padding:10px 14px;box-sizing:border-box;font-weight:700;font-size:14.5px;text-align:left}
.opt em{font-style:normal;font-family:var(--display);color:var(--coral-deep)}
.tabs{display:flex;gap:6px;background:#F3ECF8;border-radius:99px;padding:4px}
.tabs button{font-family:var(--display);font-size:15px;border-radius:99px;padding:7px 14px 5px;background:transparent;color:var(--plum-soft)}
.tabs button.on{background:#fff;color:var(--plum);box-shadow:0 2px 6px var(--shade)}
#rankList{display:flex;flex-direction:column;gap:5px;width:100%}
.rk{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;background:#FFF1E6;border-radius:14px;padding:7px 12px 7px 8px;font-size:14px;font-weight:700;text-align:left}
.rk i{font-style:normal;font-family:var(--display);font-size:16px;color:var(--plum-soft);text-align:center}
.rk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk span small{display:block;font-size:11.5px;color:var(--plum-soft);font-weight:500}
.rk em{font-style:normal;font-family:var(--display);font-size:16px;color:var(--coral-deep);font-variant-numeric:tabular-nums}
.rk.me{background:#FFE08A}.rk.pod i{color:#C98A00}
#result .card{max-height:100%;overflow-y:auto;gap:8px;padding:16px}
#result .glass,#result .glass img{width:118px;height:118px}
#result .glass::before{inset:-34px}
#result .stars{font-size:32px}#result .big{font-size:34px}
#reTop{display:flex;flex-direction:column;gap:4px;width:100%}
.rk.md{grid-template-columns:30px 1fr auto;padding:4px 12px 4px 6px}
.rk img.mdl{width:30px;height:30px;display:block}
.stg{font-family:var(--display);font-size:15px;color:var(--plum);margin:8px 0 0 4px;text-align:left}
.stg small{font-family:var(--body);font-size:11.5px;font-weight:700;color:var(--plum-soft);margin-left:6px}
#inBest,#reRec{font-size:13px;font-weight:700;color:var(--mint-deep)}
#reRec{font-family:var(--display);font-weight:400;font-size:17px;color:#C98A00}
/* recipe info on the stage card */
#intro .card{max-height:100%;overflow-y:auto;gap:9px;padding:18px 16px}
#inDesc{font-size:14.5px;color:var(--plum)}
#inIngs{display:flex;flex-direction:column;gap:5px;width:100%}
.ingr{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;background:#FFF1E6;border-radius:16px;padding:3px 12px 3px 5px;text-align:left}
.ingr img{width:42px;height:42px}
.ingr b{display:block;font-size:14.5px;font-weight:700;line-height:1.2}
.ingr span{display:block;font-size:12.5px;color:var(--plum-soft);line-height:1.3}
.ingr em{font-style:normal;font-family:var(--display);font-size:18px;color:var(--coral-deep);font-variant-numeric:tabular-nums}
/* header, juice total, shop */
.top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;position:relative}
#hub::before{content:"";position:absolute;inset:0 0 auto;height:220px;background:linear-gradient(rgba(255,248,240,.92),rgba(255,248,240,.7) 45%,rgba(255,248,240,0));pointer-events:none}
#hub>h1,#hub>.stats{position:relative}
.acts{display:flex;gap:8px}
.icb{width:44px;height:44px;border-radius:50%;background:var(--cream);display:grid;place-items:center;box-shadow:inset 0 -4px 0 #F1E3D6,0 5px 12px var(--shade);padding:0}
.icb img{width:32px;height:32px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.stat{display:flex;align-items:center;gap:8px;height:50px;box-sizing:border-box;background:var(--cream);border-radius:18px;padding:0 10px 0 7px;box-shadow:inset 0 -4px 0 #F1E3D6,0 5px 12px var(--shade);text-align:left;min-width:0}
.stat>img{width:36px;height:36px;flex:none}
.stat span{min-width:0}
.stat small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--plum-soft);line-height:1.15;white-space:nowrap}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.05;color:var(--coral-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
#hub h1{text-shadow:none}
.brand{background:var(--plum);height:44px;padding:0 16px;box-sizing:border-box;display:grid;place-items:center;border-radius:99px;box-shadow:0 5px 12px var(--shade)}
.brand img{height:15px;width:auto;display:block}
.jar{display:block;width:36px;height:36px;border-radius:50%;background:#FFEBD9;overflow:hidden;position:relative;box-shadow:inset 0 0 0 2px #fff,inset 0 3px 5px rgba(74,46,92,.18);flex:none}
.liq{position:absolute;left:-10%;right:-10%;bottom:0;height:30%;background:#FF9F2E;transition:height 1s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 100%;animation:slosh 2.6s ease-in-out infinite}
.liq svg{position:absolute;left:0;bottom:calc(100% - 1px);width:200%;height:7px;fill:#FF9F2E;animation:wave 1.5s linear infinite}
.liq svg+svg{fill:#FFC56B;opacity:.75;animation-duration:2.3s;animation-direction:reverse;bottom:calc(100% + 1px);z-index:-1}
@keyframes wave{to{transform:translateX(-50%)}}
@keyframes slosh{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
#reward .card{max-height:100%;overflow-y:auto;gap:9px;padding:18px 16px}
#shop{display:flex;flex-direction:column;gap:7px;width:100%}
.kit{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;background:#FFEFE2;border-radius:18px;padding:6px 8px 6px 6px;text-align:left}
.kit img{width:44px;height:44px}
.kit b{display:block;font-size:14px;font-weight:700;line-height:1.25}
.kit span{display:block;font-family:var(--display);font-size:16px;color:var(--coral-deep);font-variant-numeric:tabular-nums}
.kit span i{font-style:normal;font-family:var(--body);font-size:11.5px;font-weight:700;color:var(--mint-deep);margin-left:6px}
.kit button{font-family:var(--display);font-size:16px;color:#fff;background:var(--coral);border-radius:99px;padding:9px 14px 7px;box-shadow:inset 0 -4px 0 var(--coral-deep)}
.kit button:disabled{background:#E9E1EE;color:#A996B5;box-shadow:inset 0 -4px 0 #D5C9DD;cursor:default}
#rwBal{box-shadow:none;background:#FFEFE2}
a.chipbtn{text-decoration:none;background:#F3ECF8}
/* game hints + avatar */
.gm{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-sizing:border-box;box-shadow:0 2px 5px rgba(74,46,92,.3);flex:none}
.gm svg{width:14px;height:14px;display:block}
.gm.slash{background:var(--coral)}.gm.catch{background:var(--mint-deep)}.gm.link{background:#8E7BE0}.gm.tap{background:#E99A1F}.gm.mem{background:#4E9BDB}
.btn.tap{background:#F2A93B;box-shadow:inset 0 -5px 0 #CF8413,inset 0 3px 0 rgba(255,255,255,.4),0 8px 16px var(--shade)}.btn.mem{background:#5BA8E0;box-shadow:inset 0 -5px 0 #3C84BD,inset 0 3px 0 rgba(255,255,255,.4),0 8px 16px var(--shade)}
.gm.pic{width:32px;height:32px;border:0;background:var(--cream);box-shadow:0 2px 6px rgba(74,46,92,.35),inset 0 0 0 2px #fff}
.gm.pic img{width:26px;height:26px;display:block}
.node .gm{position:absolute;right:-9px;top:-9px}
.node .gm.pic{right:-12px;top:-12px}
.node .gm img{width:26px;height:26px}
#legend .gm.pic{width:26px;height:26px;box-shadow:none;background:transparent}#legend .gm.pic img{width:26px;height:26px}
.gameTag .gm.pic{width:34px;height:34px;box-shadow:none;background:transparent}.gameTag .gm.pic img{width:34px;height:34px}
.node.lock .gm{opacity:.85}
#legend{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:8px;background:rgba(255,248,240,.92);border-radius:99px;padding:5px 12px 5px 6px;font-size:12px;font-weight:700;box-shadow:0 3px 8px var(--shade);white-space:nowrap;z-index:3}
#legend span{display:flex;align-items:center;gap:4px}
#legend .gm{width:20px;height:20px;border-width:1.5px;box-shadow:none}#legend .gm svg{width:11px;height:11px}
#avatar{position:absolute;transform:translate(-50%,-60%);transition:left 1s cubic-bezier(.5,0,.3,1),top 1s cubic-bezier(.5,0,.3,1);z-index:2;pointer-events:none}
#avatar .flip{transition:transform .25s}
#avatar img{height:122px;width:auto;max-width:none;display:block;transform-origin:50% 100%;filter:drop-shadow(0 6px 6px rgba(74,46,92,.3));animation:idle 1.8s ease-in-out infinite}
#avatar.walk img{animation:hop .34s ease-in-out infinite}
.say{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:4px;width:max-content;max-width:150px;text-align:center;line-height:1.2;font-family:var(--display);font-size:13.5px;color:var(--plum);background:var(--cream);border-radius:14px;padding:5px 11px 3px;box-shadow:0 4px 10px var(--shade);animation:sayIn .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--cream);border-bottom:0}
#avatar.walk .say{opacity:0;animation:none}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1) rotate(-2.5deg)}25%{transform:translateY(-7px) scale(.98,1.03) rotate(0)}50%{transform:translateY(0) scale(1.03,.97) rotate(2.5deg)}75%{transform:translateY(-5px) scale(.98,1.03) rotate(0)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.96)}50%{transform:translateY(-14px) scale(.97,1.04) rotate(4deg)}}
@keyframes sayIn{from{opacity:0;transform:translateX(-50%) scale(.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.gameTag{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:19px;background:#FFEFE2;border-radius:99px;padding:5px 16px 4px 6px}
.btn.slash{background:var(--coral)}.btn.catch{background:var(--mint);box-shadow:inset 0 -5px 0 var(--mint-deep),inset 0 3px 0 rgba(255,255,255,.4),0 8px 16px var(--shade)}
.btn.link{background:#8E7BE0;box-shadow:inset 0 -5px 0 #6C59C4,inset 0 3px 0 rgba(255,255,255,.4),0 8px 16px var(--shade)}
@media (prefers-reduced-motion:reduce){#avatar img,.say,.liq svg,.liq{animation:none!important}}
/* how-to tip */
.demo{position:relative;width:240px;max-width:100%;height:132px;background:#FFEFE2;border-radius:22px;overflow:hidden}
.demo img{position:absolute;width:64px;height:64px}
.demo .fg{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--plum);box-shadow:0 4px 8px var(--shade);box-sizing:border-box;z-index:3}
.demo.slash img{left:88px;top:34px;width:68px;height:68px}
.demo.slash .h1{clip-path:polygon(0 0,100% 0,100% 36%,0 64%);animation:dS1 2s infinite}
.demo.slash .h2{clip-path:polygon(0 64%,100% 36%,100% 100%,0 100%);animation:dS2 2s infinite}
.demo.slash .ln{position:absolute;left:50px;top:66px;width:140px;height:8px;border-radius:9px;background:#fff;box-shadow:0 0 0 4px rgba(255,158,196,.6);transform:rotate(-20deg) scaleX(0);transform-origin:0 50%;animation:dSl 2s infinite}
.demo.slash .fg{left:37px;top:53px;animation:dSf 2s infinite}
@keyframes dSf{0%,10%{transform:translate(0,22px);opacity:0}18%{opacity:1}50%{transform:translate(134px,-28px);opacity:1}62%,100%{transform:translate(134px,-28px);opacity:0}}
@keyframes dSl{0%,18%{transform:rotate(-20deg) scaleX(0);opacity:1}50%{transform:rotate(-20deg) scaleX(1);opacity:1}70%,100%{transform:rotate(-20deg) scaleX(1);opacity:0}}
@keyframes dS1{0%,45%{transform:none;opacity:1}85%{transform:translate(-10px,-26px) rotate(-18deg);opacity:1}100%{transform:translate(-12px,-30px) rotate(-20deg);opacity:0}}
@keyframes dS2{0%,45%{transform:none;opacity:1}85%{transform:translate(10px,26px) rotate(16deg);opacity:1}100%{transform:translate(12px,30px) rotate(18deg);opacity:0}}
.demo.catch .bk{left:88px;top:66px;animation:dCb 2.4s ease-in-out infinite}
.demo.catch .fr{left:142px;top:-50px;width:46px;height:46px;animation:dCf 2.4s linear infinite}
.demo.catch .fg{left:107px;top:104px;animation:dCb 2.4s ease-in-out infinite}
@keyframes dCb{0%,8%{transform:translateX(-52px)}45%,72%{transform:translateX(46px)}100%{transform:translateX(-52px)}}
@keyframes dCf{0%,12%{transform:translateY(0);opacity:1}56%{transform:translateY(112px);opacity:1}60%,100%{transform:translateY(118px);opacity:0}}
.demo.link .tl{position:absolute;top:36px;width:60px;height:60px;border-radius:17px;background:var(--cream);box-shadow:0 3px 8px var(--shade);display:grid;place-items:center}
.demo.link .tl img{position:static;width:48px;height:48px}
.demo.link .tl:nth-of-type(1){left:22px;animation:dL1 2.6s infinite}.demo.link .tl:nth-of-type(2){left:90px;animation:dL2 2.6s infinite}.demo.link .tl:nth-of-type(3){left:158px;animation:dL3 2.6s infinite}
.demo.link .fg{left:39px;top:74px;animation:dLf 2.6s infinite}
@keyframes dLf{0%,10%{transform:none;opacity:0}16%{opacity:1}36%{transform:translateX(68px)}58%,70%{transform:translateX(136px);opacity:1}78%,100%{transform:translateX(136px);opacity:0}}
@keyframes dL1{0%,14%{background:var(--cream);transform:none}16%,70%{background:var(--coral);transform:scale(1.08)}80%,100%{background:var(--coral);transform:scale(0)}}
@keyframes dL2{0%,34%{background:var(--cream);transform:none}36%,70%{background:var(--coral);transform:scale(1.08)}80%,100%{background:var(--coral);transform:scale(0)}}
@keyframes dL3{0%,56%{background:var(--cream);transform:none}58%,70%{background:var(--coral);transform:scale(1.08)}80%,100%{background:var(--coral);transform:scale(0)}}
.demo.tap .md{position:absolute;left:78px;top:92px;width:84px;height:24px;border-radius:50%;background:#7A5544}
.demo.tap img{left:88px;top:40px;animation:dT 2s infinite}
.demo.tap .fg{left:107px;top:60px;animation:dTf 2s infinite}
@keyframes dT{0%,8%{transform:translateY(46px) scale(.6);opacity:0}22%,58%{transform:none;opacity:1}66%{transform:scale(1.25);opacity:1}76%,100%{transform:scale(0);opacity:0}}
@keyframes dTf{0%,40%{transform:translate(34px,38px);opacity:0}50%{transform:translate(8px,12px);opacity:1}60%{transform:translate(0,0) scale(.8);opacity:1}72%,100%{transform:translate(0,0);opacity:0}}
.demo.mem .tl{position:absolute;top:30px;width:66px;height:74px;border-radius:16px;background:var(--coral);box-shadow:0 3px 8px var(--shade);display:grid;place-items:center}
.demo.mem .tl:nth-of-type(1){left:44px;animation:dM 3s infinite}.demo.mem .tl:nth-of-type(2){left:130px;animation:dM 3s .7s infinite both}
.demo.mem .tl img{position:static;width:52px;height:52px;animation:dMi 3s infinite}
.demo.mem .tl:nth-of-type(2) img{animation-delay:.7s;animation-fill-mode:both}
.demo.mem .fg{left:64px;top:84px;animation:dMf 3s infinite}
@keyframes dM{0%,12%{background:var(--coral);transform:scaleX(1)}17%{transform:scaleX(0)}22%,100%{background:var(--cream);transform:scaleX(1)}}
@keyframes dMi{0%,17%{opacity:0}22%,100%{opacity:1}}
@keyframes dMf{0%,6%{transform:none;opacity:0}12%{opacity:1}26%{transform:none;opacity:1}36%,44%{transform:translateX(86px);opacity:1}52%,100%{transform:translateX(86px);opacity:0}}
#tipGo{position:relative;overflow:hidden}
#tipGo.auto::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.8);transform-origin:0 50%;animation:tipbar 2.8s linear forwards}
@keyframes tipbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.demo *{animation:none!important}}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bar{display:flex;align-items:center;gap:8px}
.pill{background:rgba(255,248,240,.92);border-radius:99px;padding:7px 14px 5px;font-family:var(--display);font-size:20px;box-shadow:0 4px 10px var(--shade);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-family:var(--body);font-size:11px;font-weight:700;color:var(--plum-soft);margin-right:5px}
#time.low{background:var(--coral);color:#fff}#time.low small{color:#fff}
.round{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(255,248,240,.92);box-shadow:0 4px 10px var(--shade);font-size:17px;font-weight:700;display:grid;place-items:center;flex:none}
.grow{flex:1}
#rname{font-family:var(--display);font-size:15px;color:var(--plum);background:rgba(255,248,240,.8);border-radius:99px;padding:4px 12px 3px;align-self:center}
#chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;background:rgba(255,248,240,.94);border-radius:99px;padding:4px 12px 4px 5px;font-family:var(--display);font-size:18px;box-shadow:0 4px 10px var(--shade);font-variant-numeric:tabular-nums;transition:transform .15s}
.chip img{width:34px;height:34px}
.chip.done{background:var(--mint);color:#fff}
.chip.bump{transform:scale(1.18)}
.chip.sq{padding:3px;box-shadow:0 3px 8px var(--shade)}.chip.sq img{width:30px;height:30px}.chip.sq.done{transform:scale(1.12)}
#chips.seq{gap:4px}
/* intro + result */
.ings{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ing{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;color:var(--plum-soft);width:72px}
.ing img{width:60px;height:60px}
.ing em{font-style:normal;font-family:var(--display);font-size:17px;color:var(--plum)}
.tag{font-size:12.5px;font-weight:700;color:var(--coral-deep);letter-spacing:.04em}
.how{font-size:14.5px;color:var(--plum);background:#FFEFE2;border-radius:16px;padding:10px 14px}
.glass{position:relative;width:170px;height:170px;display:grid;place-items:center}
.glass::before{content:"";position:absolute;inset:-46px;border-radius:50%;background:repeating-conic-gradient(rgba(255,201,77,.55) 0 12deg,transparent 12deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%);animation:spin 14s linear infinite}
.glass img{position:relative;width:170px;height:170px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stars{display:flex;gap:6px;font-size:40px;line-height:1;color:#E3D6EC}
.stars span.on{color:var(--gold);text-shadow:0 3px 0 #E0A52E;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.stars span:nth-child(2).on{animation-delay:.18s}.stars span:nth-child(3).on{animation-delay:.36s}
.big{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .btn{min-width:0;font-size:19px;padding:12px 20px 10px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.glass::before,.glass img,.stars span.on{animation:none}}
@media (max-height:620px){h1{font-size:32px}.glass,.glass img{width:120px;height:120px}.card{padding:16px;gap:9px}.ing img{width:48px;height:48px}}
</style>
</head>
<body>


<div id="stage">
  <canvas id="cv"></canvas>

  <div id="fxTop"></div>

  <div id="hud" hidden>
    <div class="bar">
      <button class="round" id="pauseBtn" aria-label="일시정지">Ⅱ</button>
      <div class="pill" id="time"><small>남은 시간</small><span id="timeV">60</span></div>
      <div class="grow"></div>
      <div class="pill"><small>착즙량</small><span id="scoreV">0mL</span></div>
    </div>
    <div id="rname"></div>
    <div id="chips"></div>
  </div>

  <div class="layer" id="loading"><p class="sub">재료를 준비하고 있어요…</p></div>

  <div class="layer" id="hub" hidden>
    <div id="fx"></div>
    <div id="map"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="trail"></polyline></svg>
      <div id="nodes"></div><div id="avatar"><div class="say" id="say"></div><div class="flip"><img alt="과일 바구니를 든 농장 안내인" data-a="avatar"></div></div></div>
    <div class="top"><div class="brand"><img alt="Hurom" data-a="logo"></div>
      <div class="acts"><button class="icb" id="rankBtn" aria-label="순위 보기"><img alt="" data-a="ic_rank"></button><button class="icb" id="setBtn" aria-label="설정"><img alt="" data-a="ic_set"></button></div></div>
    <h1>휴롬 농장 탐험</h1>
    <div class="stats">
      <div class="stat" id="totalP"><i class="jar"><i class="liq" id="liq"><svg viewBox="0 0 80 12" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6Q5 0 10 6T20 6T30 6T40 6T50 6T60 6T70 6T80 6V12H0z"/></svg><svg viewBox="0 0 80 12" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6Q5 0 10 6T20 6T30 6T40 6T50 6T60 6T70 6T80 6V12H0z"/></svg></i></i><span><small>지금까지 착즙한 양</small><b id="totalV">0.0L</b></span></div>
      <button class="stat" id="giftBtn"><img alt="" data-a="gift"><span><small id="giftL">주스키트 상점까지</small><b id="giftV">0/10</b></span></button>
    </div>
    <div id="legend"></div>
  </div>

  <div class="layer dim" id="intro" hidden>
    <div class="card">
      <div class="tag" id="inNo"></div>
      <h2 id="inName"></h2>
      <p id="inDesc"></p>
      <div id="inIngs"></div>
      <p id="inBest"></p>
      <div class="gameTag" id="inGame"></div>
      <p class="how" id="inHow"></p>
      <button class="btn" id="startBtn">시작하기</button>
      <button class="chipbtn" id="introHome">농장으로</button>
    </div>
  </div>

  <div class="layer dim" id="tip" hidden>
    <div class="card">
      <div class="tag">이렇게 해요</div>
      <h2 id="tipTitle"></h2>
      <div class="demo" id="demo" aria-hidden="true"></div>
      <p id="tipText"></p>
      <button class="btn" id="tipGo">시작!</button>
    </div>
  </div>

  <div class="layer dim" id="pause" hidden>
    <div class="card">
      <h2>잠깐 쉬는 중</h2>
      <button class="btn" id="resumeBtn">계속하기</button>
      <button class="btn alt" id="quitBtn">농장으로</button>
    </div>
  </div>

  <div class="layer dim" id="reward" hidden>
    <div class="card">
      <h2>주스키트 상점</h2>
      <p class="sub" id="rwText"></p>
      <div class="pill" id="rwBal"></div>
      <div id="shop"></div>
      <p class="tag" id="rwNote"></p>
      <a class="chipbtn" id="rwLink" href="https://m.hurom.co.kr/goods/goods_list.php?cateCd=030" target="_blank" rel="noopener">휴롬 주스키트 자세히 보기</a>
      <button class="chipbtn" id="rwClose">농장으로 돌아가기</button>
    </div>
  </div>

  <div class="layer dim" id="welcome" hidden>
    <div class="card">
      <div class="brand"><img alt="Hurom" data-a="logo"></div>
      <h2>농장에 오신 걸 환영해요</h2>
      <p class="sub">함께할 농부를 고르고 이름을 알려 주세요.</p>
      <div class="avs" id="wAvs"><button class="avc on" data-av="f" aria-label="여자 농부"><img alt="" data-a="avatar"></button><button class="avc" data-av="m" aria-label="남자 농부"><img alt="" data-a="avatar_m"></button></div>
      <div class="frow"><input type="text" id="wName" maxlength="10" placeholder="이름 (최대 10자)" autocomplete="off"></div>
      <p class="tag" id="wMsg"></p>
      <button class="btn" id="wGo">농장으로 출발!</button>
    </div>
  </div>

  <div class="layer dim" id="settings" hidden>
    <div class="card">
      <h2>설정</h2>
      <div class="frow"><label>아바타 바꾸기</label><div class="avs sm" id="setAvs"></div></div>
      <div class="frow"><label for="setName">내 이름</label><input type="text" id="setName" maxlength="10" placeholder="순위표에 남길 이름" autocomplete="off"><button class="sbtn" id="setNameSave">저장</button></div>
      <p class="tag" id="setMsg"></p>
      <button class="opt" id="sndBtn">소리 켜짐</button>
      <button class="opt" id="vibBtn"></button>
      <button class="opt" id="tipReset">게임 방법 다시 보기</button>
      <button class="opt" id="wipeBtn">내 기록 처음부터 다시</button>
      <button class="chipbtn" id="setClose">농장으로 돌아가기</button>
    </div>
  </div>

  <div class="layer dim" id="rank" hidden>
    <div class="card">
      <h2>착즙 순위</h2>
      <div class="tabs"><button id="tabAll" class="on">전체 순위</button><button id="tabStage">스테이지별 1·2·3등</button></div>
      <p class="sub" id="rankMsg"></p>
      <div id="rankList"></div>
      <button class="chipbtn" id="rankClose">농장으로 돌아가기</button>
    </div>
  </div>

  <div class="layer dim" id="result" hidden>
    <div class="card">
      <div class="glass" id="reGlass"><img alt="" id="reImg"></div>
      <h2 id="reTitle"></h2>
      <div class="stars" id="reStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="big" id="reScore"></div>
      <p class="sub" id="reSub"></p>
      <p id="reRec"></p>
      <div id="reTop"></div>
      <div class="frow" id="nameRow" hidden><input type="text" id="nameIn" maxlength="10" placeholder="순위표에 남길 이름" autocomplete="off"><button class="sbtn" id="nameSave">남기기</button></div>
      <div class="row">
        <button class="btn mint" id="nextBtn">다음 레시피</button>
        <button class="btn alt" id="retryBtn">다시 하기</button>
        <button class="btn alt" id="homeBtn">농장으로</button>
      </div>
    </div>
  </div>
</div>

  for(let i=0;i<n;i++){const g=H*1.05,h=H*(.5+Math.random()*.28),x=W*(.14+Math.random()*.72);
    const star=Math.random()<.06;

  x.fillStyle=g;x.fillRect(-S,side>0?0:-16,2*S,16);return c}

function spawnCatch(){const star=Math.random()<.05;const sp=H*(.26+Math.min(elapsed,50)*.0036+Math.random()*.06)*(LV[stageNo].fs||1);

/* ---------- link ---------- */
const GC=6,GR=7;let grid=[],seq=[],chain=[],cups=0,goal=4,cell=40,gx=0,gy=0,idle=0,hintP=null;
function geo(){const top=$('hud').getBoundingClientRect().bottom-stage.getBoundingClientRect().top+12;cell=Math.min((W-20)/GC,(H-top-14)/GR);gx=(W-cell*GC)/2;gy=top+Math.max(0,(H-top-14-cell*GR)/2)}
function rk(){const ks=Object.keys(R.i),w=ks.map(k=>R.i[k]+1);for(const p of pool){ks.push(p);w.push(1.4)}let r=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<ks.length;i++)if((r-=w[i])<0)return ks[i];return ks[0]}

  for(let r=0;r<GR;r++)for(let c=0;c<GC;c++)if(grid[r][c].k===seq[0]&&dfs(c,r,0))return out.slice();return null}
function ensure(fresh){hintP=findPath();let n=0;while(!hintP&&n++<60){for(const row of grid)for(const c of row)if(fresh||c.oy<0||n>8)c.k=rk();hintP=findPath()}
  if(n>8&&!fresh)floatText(W/2,gy-18*U,'재료를 새로 섞었어요','#7B6189',20)}
function initLink(){seq=[];for(const k in R.i)for(let i=0;i<R.i[k];i++)seq.push(k);goal=LV[stageNo].cups||3;cups=0;chain=[];idle=0;geo();
  grid=[];for(let r=0;r<GR;r++){grid.push([]);for(let c=0;c<GC;c++)grid[r].push({k:rk(),oy:-(GR-r+2+c*.3)*cell})}ensure(true)}

function sqUpd(){seq.forEach((_,i)=>{const e=$('sq'+i);if(e)e.classList.toggle('done',i<chain.length)})}

function linkMove(p){if(!chain.length)return;const q=cellAt(p,true);if(!q)return;const l=chain[chain.length-1];if(q[0]===l[0]&&q[1]===l[1])return;
  const pv=chain[chain.length-2];if(pv&&pv[0]===q[0]&&pv[1]===q[1]){chain.pop();sqUpd();return}
  if(Math.abs(q[0]-l[0])>1||Math.abs(q[1]-l[1])>1||chain.some(c=>c[0]===q[0]&&c[1]===q[1]))return;
  if(grid[q[1]][q[0]].k!==seq[chain.length])return;chain.push(q);idle=0;SFX.catch(chain.length);buzz(8);sqUpd();if(chain.length===seq.length)linkPop()}
function linkPop(){combo++;const pts=seq.length*10+Math.min(combo-1,5)*10;score+=pts;cups++;let cx=0,cy=0;
  for(const [c,r] of chain){const x=gx+(c+.5)*cell,y=gy+(r+.5)*cell;cx+=x;cy+=y;burst(x,y,ING[grid[r][c].k][1],9);grid[r][c]=null}
  cx/=chain.length;cy/=chain.length;floatText(cx,cy,'+'+pts+'mL','#E85D50',28);floatText(W/2,gy-18*U,`주스 ${cups}잔 완성!`,'#C98A00',26);SFX.good(combo);SFX.star();buzz(25);chain=[];
  for(let c=0;c<GC;c++){const st=[];for(let r=GR-1;r>=0;r--)if(grid[r][c])st.push([grid[r][c],r]);
    for(let r=GR-1;r>=0;r--){const i=GR-1-r;if(i<st.length){const t=st[i][0];t.oy-=(r-st[i][1])*cell;grid[r][c]=t}else grid[r][c]={k:rk(),oy:-(r+2)*cell}}}
  const e=$('cupchip');if(e){e.querySelector('span').textContent=`${cups}/${goal}잔`;e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),160)}
  sqUpd();if(cups>=goal){finish(true);return}ensure(false);idle=0}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawLink(){ctx.save();ctx.beginPath();ctx.rect(0,gy-6,W,H);ctx.clip();const inC=(c,r)=>chain.findIndex(q=>q[0]===c&&q[1]===r);
  const hintOn=playing&&idle>4&&hintP&&!chain.length,pulse=.5+.5*Math.sin(performance.now()/180);
  for(let r=0;r<GR;r++)for(let c=0;c<GC;c++){const t=grid[r]&&grid[r][c];if(!t)continue;const x=gx+(c+.5)*cell,y=gy+(r+.5)*cell+t.oy,sel=inC(c,r)>=0,s=cell-6;

/* ---------- tap: harvest ---------- */
let holes=[],tapT=0;
function tapGeo(){const rows=LV[stageNo].d>=4?4:3,top=H*.36,bh=(H*.93-top)/rows,cw=W/3;holes.forEach((h,i)=>{h.x=cw*(i%3+.5);h.y=top+bh*((i/3|0)+.66)})}
function initTap(){const rows=LV[stageNo].d>=4?4:3;holes=[];for(let i=0;i<rows*3;i++)holes.push({k:null,t:0,dur:1,x:0,y:0});tapGeo();tapT=.5}

    const sp=LV[stageNo].sp||.9;tapT=Math.max(sp*.6,sp-elapsed*.006)*(.7+Math.random()*.6)}
  for(const h of holes)if(h.k){h.t+=dt;if(h.t>h.dur)h.k=null}}
function tapDown(p){let best=null;for(const h of holes)if(h.k&&Math.abs(p.x-h.x)<52*U&&p.y>h.y-100*U&&p.y<h.y+26*U&&(!best||Math.abs(p.x-h.x)<Math.abs(p.x-best.x)))best=h;
  if(!best)return;const k=best.k;best.k=null;const y=best.y-44*U;if(k==='*')hitStar(best.x,y);else if(k in need)hitGood({k},best.x,y);else hitBad(best.x,y)}
function drawTap(){for(const h of holes){const rx=50*U,ry=17*U;ctx.fillStyle='rgba(74,46,30,.28)';ctx.beginPath();ctx.ellipse(h.x,h.y+5*U,rx*1.12,ry*1.25,0,0,6.3);ctx.fill();

      const cy=h.y+r*.7-e*r*1.45+Math.sin(h.t*9)*2*U;if(h.k==='*')drawGoldStar(h.x,cy,34*U,Math.sin(h.t*4)*.3);else{const im=IMG[h.k];if(im&&im.naturalWidth)ctx.drawImage(im,h.x-r,cy-r,r*2,r*2)}ctx.restore()}

/* ---------- mem: card pairs ---------- */

function memGeo(){const top=$('hud').getBoundingClientRect().bottom-stage.getBoundingClientRect().top+14;mw=Math.min((W-24)/mcols,(H-top-16)/mrows/1.16);mh=mw*1.16;mx=(W-mw*mcols)/2;my=top+Math.max(0,(H-top-16-mh*mrows)/2)}
function initMem(){mrows=LV[stageNo].d>=4?4:3;const n=mcols*mrows/2,ks=[];need={};got={};

  for(let i=0;ks.length<n;i++)ks.push(pool[i%pool.length]);ks.length=n;const deck=[...ks,...ks];for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}

    SFX.done();rain(RM?30:110);burst(W/2,H*.3,'#FFC94D',40)}
  else{$('reRec').textContent='';$('reTop').innerHTML='';$('nameRow').hidden=true;$('reGlass').hidden=true;$('reTitle').textContent='조금만 더 모으면 돼요';$('reStars').hidden=true;$('reScore').textContent=score.toLocaleString()+'mL';
    const left=Object.keys(need).filter(k=>got[k]<need[k]).map(k=>`${ING[k][0]} ${need[k]-got[k]}개`).join(', ');
    $('reSub').textContent=(mode==='link'?`주스 ${goal-cups}잔만 더 만들면 돼요.`:'남은 재료: '+left+'.')+' 주스를 완성해야 착즙량에 더해져요.';$('nextBtn').hidden=true;SFX.fail()}
  setTimeout(()=>show('result'),ok?650:250)}

/* ---------- loop ---------- */
function update(dt){
  if(playing&&!paused){elapsed+=dt;timeLeft-=dt;
    if(timeLeft<=10&&Math.ceil(timeLeft)!==lastTick){lastTick=Math.ceil(timeLeft);if(timeLeft>0)SFX.tick()}
    if(mode==='link'){idle+=dt;for(const row of grid)for(const t of row)if(t&&t.oy<0)t.oy=Math.min(0,t.oy+cell*13*dt)}
    if(mode==='tap')tapUpdate(dt);if(mode==='mem')memUpdate(dt);
    spawnT-=dt;if((mode==='slash'||mode==='catch')&&spawnT<=0){if(mode==='slash'){spawnSlash();const sp=LV[stageNo].sp||1.2;spawnT=Math.max(sp*.62,sp-elapsed*.008)}else{spawnCatch();const sp=LV[stageNo].sp||.8;spawnT=Math.max(sp*.6,sp-elapsed*.006)}}
    if(mode==='catch'){const bw=basket.w=120*U,by=H-212*U;basket.x+=(Math.max(bw*.45,Math.min(W-bw*.45,basket.tx))-basket.x)*Math.min(1,dt*18);basket.squash=Math.max(0,basket.squash-dt*4);
      for(const f of fruits){if(f.dead)continue;if(f.y>by-18*U&&f.y<by+26*U&&Math.abs(f.x-basket.x)<bw*.42){f.dead=true;basket.squash=1;
        if(f.k==='*')hitStar(f.x,by-20*U);else if(f.k in need)hitGood(f,f.x,by-20*U);else hitBad(f.x,by-20*U)}}}
    hud();if(playing&&timeLeft<=0)finish(false)}
  for(const f of fruits){if(f.delay>0){f.delay-=dt;continue}f.vy+=f.g*dt;f.x+=f.vx*dt+(f.sw!=null?Math.sin(elapsed*2+f.sw)*32*(LV[stageNo].sw||0)*U*dt:0);f.y+=f.vy*dt;f.rot+=f.vr*dt;
    if(f.y>H+90*U&&f.vy>0)f.dead=true}
  fruits=fruits.filter(f=>!f.dead);
  for(const h of halves){h.vy+=H*1.2*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt;h.life+=dt}
  halves=halves.filter(h=>h.y<H+100*U&&h.life<2);
  for(const p of parts){p.life+=dt;if(p.t!=='r'){p.vy+=p.g*U*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
  parts=parts.filter(p=>p.life<p.max);
  for(const f of floats)f.life+=dt;floats=floats.filter(f=>f.life<.9);
  shake=Math.max(0,shake-dt)}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(shake>0){ctx.translate((Math.random()-.5)*10*shake*4*U,(Math.random()-.5)*10*shake*4*U)}
  if(playing)drawMotes(1/60);
  if(mode==='link'&&(playing||paused)&&grid.length)drawLink();
  if(mode==='tap'&&(playing||paused))drawTap();if(mode==='mem'&&(playing||paused))drawMem();
  for(const h of halves){ctx.save();ctx.globalAlpha=Math.max(0,1-h.life/1.6);ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.drawImage(h.c,-h.r,-h.r,h.r*2,h.r*2);ctx.restore()}
  for(const f of fruits){if(f.delay>0)continue;
    if(f.k==='*'){drawGoldStar(f.x,f.y,f.r,f.rot);continue}
    const im=IMG[f.k];ctx.save();ctx.translate(f.x,f.y);ctx.rotate(mode==='catch'?Math.sin(f.rot)*.35:f.rot);
    if(im&&im.naturalWidth)ctx.drawImage(im,-f.r,-f.r,f.r*2,f.r*2);else{ctx.fillStyle=ING[f.k][1];ctx.beginPath();ctx.arc(0,0,f.r*.8,0,6.3);ctx.fill()}
    ctx.restore()}
  if(mode==='catch'&&(playing||paused)){const im=IMG.juicer,S=206*U,s=basket.squash,by=H-212*U;ctx.save();ctx.translate(basket.x,by-10*U+S);ctx.scale(1+s*.05,1-s*.05);
    if(im&&im.naturalWidth)ctx.drawImage(im,-S/2,-S,S,S);else{ctx.fillStyle='#fff';ctx.fillRect(-45*U,-S,90*U,S)}ctx.restore()}
  for(const id in trails){const tr=trails[id],now=performance.now();const pts=tr.filter(p=>now-p.t<170);if(pts.length<2)continue;
    ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=1;i<pts.length;i++){const w=(i/pts.length);ctx.strokeStyle='rgba(255,158,196,.55)';ctx.lineWidth=18*U*w;ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=8*U*w;ctx.stroke()}}
  for(const p of parts){const a=1-p.life/p.max;
    if(p.t==='r'){ctx.globalAlpha=a*.8;ctx.strokeStyle=p.c;ctx.lineWidth=6*U*a+1;ctx.beginPath();ctx.arc(p.x,p.y,p.r+(1-a)*70*U,0,6.3);ctx.stroke()}
    else if(p.t==='s'){ctx.globalAlpha=Math.min(1,a*1.6);drawStar(p.x,p.y,p.r*(.5+a*.5),p.rot,p.c)}
    else{ctx.globalAlpha=Math.min(1,a*1.8);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.5*Math.cos(p.rot*2),p.r*2,p.r*Math.cos(p.rot*2));ctx.restore()}}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floats){const t=f.life/.9;ctx.globalAlpha=1-t*t;ctx.font=`${f.size*(1+Math.sin(Math.min(1,t*4)*Math.PI)*.25)}px Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    ctx.lineWidth=6*U;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(f.txt,f.x,f.y-t*46*U);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-t*46*U)}
  ctx.globalAlpha=1}
function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(!paused)update(dt);draw();requestAnimationFrame(frame)}

/* ---------- records shared with other players ---------- */
let DB=null,UID=null,players=[],rankState='off',rankTab='all';
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function myName(){return store.get('name','')}

function meRow(){return{name:myName()||'나',ml:store.get('ml',0),stars:prog().reduce((a,b)=>a+b,0),best:myBest(),me:true}}
function board(){return[...players.filter(p=>p.id!==UID),meRow()]}
let freshT=0;
function tops(){const t=store.get('top',[]),b=myBest();return RECIPES.map((_,i)=>Array.isArray(t[i])&&t[i].length?t[i]:b[i]?[{n:myName()||'나',ml:b[i],t:0}]:[])}
function stageTop3(i){const mine=tops()[i].map(e=>({name:e.n,ml:e.ml|0,me:true,fresh:!!e.t&&e.t===freshT})),oth=players.filter(p=>p.id!==UID&&(p.best[i]|0)>0).map(p=>({name:p.name,ml:p.best[i]|0}));

function stageTop(i){return stageTop3(i)[0]||null}

function pushMe(){if(!DB||!UID||!myName())return;const m=meRow();DB.doc('players/'+UID).set({name:m.name.slice(0,10),ml:m.ml,stars:m.stars,best:m.best,at:Date.now()}).catch(()=>{})}
function saveName(v){v=String(v||'').replace(/\s+/g,' ').trim().slice(0,10);if(!v)return false;store.set('name',v);pushMe();return true}
(async()=>{try{if(!window.claude||!window.claude.use)return;rankState='loading';const d=await window.claude.use('db'),u=await window.claude.use('user');if(!d||!u){rankState='off';return}
  DB=d;UID=await u.id();const t=setTimeout(()=>{if(rankState==='loading'){rankState='off';refreshRank()}},10000);
  DB.collection('players').limit(300).onSnapshot(sn=>{clearTimeout(t);rankState='on';players=sn.docs.map(x=>{const v=x.data()||{};return{id:x.id,name:String(v.name||'이름 없음').slice(0,10),ml:Math.max(0,+v.ml||0),stars:+v.stars||0,best:Array.isArray(v.best)?v.best.map(n=>Math.max(0,+n||0)):[]}});refreshRank()},()=>{clearTimeout(t);rankState='off';refreshRank()});
  pushMe()}catch(e){rankState='off'}})();
function renderRank(){$('tabAll').classList.toggle('on',rankTab==='all');$('tabStage').classList.toggle('on',rankTab==='stage');const b=board();
  $('rankMsg').textContent=rankState==='on'?`함께 착즙하는 사람 ${b.length}명`+(myName()?'':' · 설정에서 이름을 정하면 내 기록도 올라가요'):rankState==='loading'?'다른 사람들의 기록을 불러오는 중이에요…':'이 화면에서는 내 기록만 볼 수 있어요.';
  if(rankTab==='all'){const l=b.slice().sort((x,y)=>y.ml-x.ml),mi=l.findIndex(p=>p.me),top=l.slice(0,15);if(mi>=15)top.push(l[mi]);
    $('rankList').innerHTML=top.map(p=>{const r=l.indexOf(p)+1;return`<div class="rk${p.me?' me':''}${r<=3?' pod':''}">${r<=3?medal(r):`<i>${r}</i>`}<span>${esc(p.name)}${p.me?' (나)':''}<small>별 ${p.stars}개</small></span><em>${fmtL(p.ml)}</em></div>`}).join('')}
  else $('rankList').innerHTML=RECIPES.map((r,i)=>`<div class="stg">${i+1}. ${esc(r.n)}<small>${GS[GM[i]]}</small></div>`+(top3Html(i)||'<div class="rk"><i>-</i><span><small>아직 기록이 없어요</small></span><em></em></div>')).join('')}
function refreshRank(){if(!$('rank').hidden)renderRank()}
function openRank(){show('rank');renderRank()}
let wipeArm=false;
function openSettings(msg){show('settings');$('setAvs').innerHTML=['f','m'].map(v=>`<button class="avc${store.get('av','f')===v?' on':''}" data-av="${v}" aria-label="${v==='f'?'여자':'남자'} 농부"><img alt="" src="${A[v==='m'?'avatar_m':'avatar']||''}"></button>`).join('');$('setName').value=myName();$('setMsg').textContent=msg||'';$('sndBtn').innerHTML=`소리 <em>${soundOn?'켜짐':'꺼짐'}</em>`;$('vibBtn').innerHTML=`진동 <em>${store.get('vib',true)?'켜짐':'꺼짐'}</em>`;
  $('wipeBtn').innerHTML=wipeArm?'정말 지울까요? <em>한 번 더 누르면 지워져요</em>':'내 기록 처음부터 다시'}
function wipe(){if(!wipeArm){wipeArm=true;openSettings();return}wipeArm=false;for(const k of['prog','ml','spent','kits','best','top','tip_slash','tip_catch','tip_link','tip_tap','tip_mem','best_slash','best_catch','best_link','best_tap','best_mem'])try{localStorage.removeItem('hj_'+k)}catch(e){}
  if(DB&&UID)DB.doc('players/'+UID).delete().catch(()=>{});openSettings('기록을 모두 지웠어요.')}

/* ---------- lively touches ---------- */
// 농장 그림 속 반응 지점: x, y, 너비, 높이(그림 비율), 떨어지는 재료
const HOT=[[.04,.08,.24,.15,'apple'],[.24,.04,.21,.14,'orange'],[.45,.06,.22,.13,'lemon'],[.70,.04,.29,.16,''],[0,.29,.31,.17,''],[.64,.25,.35,.16,'cucumber'],[0,.46,.31,.11,'spinach']];
function coverBox(){const sc=Math.max(W/720,H/1280),dw=720*sc,dh=1280*sc;return{dw,dh,ox:(W-dw)/2,oy:(H-dh)/2}}
function el(host,cls,x,y,vars){const e=document.createElement(cls.startsWith('pt')?'img':'i');e.className=cls;e.style.left=x+'px';e.style.top=y+'px';for(const k in vars||{})k==='src'?e.src=vars[k]:e.style.setProperty(k,vars[k]);
  host.appendChild(e);e.addEventListener('animationend',()=>e.remove());setTimeout(()=>e.remove(),3200);return e}
function sparks(host,x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,d=22+Math.random()*26;el(host,'sp'+(i%2?' w':''),x,y,{'--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px'})}}
function jig(x,y,w,h,soft){const fx=$('fx');if(fx.querySelectorAll('.jig').length>5)return;const c=coverBox(),e=el(fx,'jig'+(soft?' soft':''),x,y);e.style.width=w+'px';e.style.height=h+'px';
  e.style.backgroundSize=`${c.dw}px ${c.dh}px`;e.style.backgroundPosition=`${c.ox-x}px ${c.oy-y}px`}
function poke(px,py,soft){const c=coverBox(),fxn=(px-c.ox)/c.dw,fyn=(py-c.oy)/c.dh,fx=$('fx'),h=HOT.find(h=>fxn>=h[0]&&fxn<=h[0]+h[2]&&fyn>=h[1]&&fyn<=h[1]+h[3]);
  if(h){jig(c.ox+h[0]*c.dw,c.oy+h[1]*c.dh,h[2]*c.dw,h[3]*c.dh,soft);if(soft)return;swish();
    if(h[4])for(let i=0;i<3;i++)el(fx,'pt',px+(Math.random()-.5)*h[2]*c.dw*.6,c.oy+(h[1]+h[3]*.45)*c.dh,{src:A[h[4]]||'','--dx':(Math.random()-.5)*50+'px'});else sparks(fx,px,py,7)}
  else if(soft)return;
  else if(fyn>.72){jig(px-55,py-70,110,110);el(fx,'pt up',px,py-14,{src:A[fyn>.84?'carrot':fyn>.77?'beet':'kale']||''});tone(520,.1,'sine',.1,760)}
  else{jig(px-55,py-55,110,110);sparks(fx,px,py,5);tone(700,.07,'sine',.07,940)}
  el(fx,'rg',px,py)}
$('hub').addEventListener('pointerdown',e=>{if(e.target.closest('button,a,input'))return;const r=stage.getBoundingClientRect();ac();poke(e.clientX-r.left,e.clientY-r.top)});
setInterval(()=>{if(RM||$('hub').hidden||document.hidden)return;const h=HOT[Math.random()*HOT.length|0],c=coverBox();poke(c.ox+(h[0]+h[2]/2)*c.dw,c.oy+(h[1]+h[3]/2)*c.dh,true)},2400);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button,a.btn,a.chipbtn');if(!b||b.disabled)return;b.classList.remove('boing');void b.offsetWidth;b.classList.add('boing');
  if(!RM&&e.clientX){const r=stage.getBoundingClientRect();sparks($('fxTop'),e.clientX-r.left,e.clientY-r.top,5)}},true);
const motes=Array.from({length:14},()=>({x:Math.random(),y:Math.random(),r:2+Math.random()*4,s:.02+Math.random()*.03,p:Math.random()*6}));
function drawMotes(dt){if(RM)return;ctx.fillStyle='#fff';for(const m of motes){m.y-=m.s*dt;if(m.y<-.05){m.y=1.05;m.x=Math.random()}const x=(m.x+Math.sin(performance.now()/1900+m.p)*.03)*W;
  ctx.globalAlpha=.16+.14*Math.sin(performance.now()/700+m.p);ctx.beginPath();ctx.arc(x,m.y*H,m.r*U,0,6.3);ctx.fill()}ctx.globalAlpha=1}

/* ---------- wiring ---------- */
const tap=(id,fn)=>$(id).addEventListener('click',()=>{ac();SFX.tap();fn()});
$('nodes').addEventListener('click',e=>{const b=e.target.closest('.node');if(!b||b.disabled)return;ac();SFX.tap();intro(+b.dataset.i)});

$('wName').addEventListener('input',()=>{$('wMsg').textContent=''});
tap('wGo',()=>{if(!saveName($('wName').value)){$('wMsg').textContent='이름을 한 글자 이상 적어 주세요.';return}store.set('av',wAv);hub()});
tap('giftBtn',()=>reward());tap('setBtn',()=>{wipeArm=false;openSettings()});tap('setClose',hub);tap('rankBtn',openRank);tap('rankClose',hub);tap('tabAll',()=>{rankTab='all';renderRank()});tap('tabStage',()=>{rankTab='stage';renderRank()});
tap('vibBtn',()=>{store.set('vib',!store.get('vib',true));openSettings();buzz(30)});tap('tipReset',()=>{for(const m of['slash','catch','link','tap','mem'])store.set('tip_'+m,false);openSettings('다음 게임부터 방법을 다시 보여 드려요.')});tap('wipeBtn',wipe);
tap('setNameSave',()=>openSettings(saveName($('setName').value)?'이름을 저장했어요.':'이름을 한 글자 이상 적어 주세요.'));tap('nameSave',()=>{if(saveName($('nameIn').value)){const tp=tops();tp[stageNo].forEach(e=>{if(e.t===freshT)e.n=myName()});store.set('top',tp);renderTop3('reTop',stageNo);$('nameRow').hidden=true;$('reRec').textContent=`${myName()} 님 이름으로 기록을 남겼어요`}});$('shop').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled){ac();buyKit(+b.dataset.k)}});tap('rwClose',hub);tap('startBtn',()=>tip(GM[stageNo]));tap('tipGo',tipGo);tap('introHome',hub);
tap('pauseBtn',()=>{if(!playing)return;paused=true;show('pause')});tap('resumeBtn',()=>{paused=false;last=performance.now();show(null)});

$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;store.set('snd',soundOn);openSettings();if(soundOn){ac();SFX.tap()}});

window.__hj={setScore(v){score=v},intro,start,hub,reward,store,poke,openRank,openSettings,get link(){return{grid,seq,hintP,gx,gy,cell,cups,goal}},get tapS(){return holes},get mem(){return{cards,mx,my,mw,mh,mprev}},get s(){return{fruits,score,got,need,playing,W,H,timeLeft}},slice,basket,finish};
